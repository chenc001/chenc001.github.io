<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="marked.umd.js"></script>
  <style>
    :root { color-scheme: dark; --bg:#171710; --surface:#201f18; --border:#4d4b40; --text:#e8e6d8; --muted:#a7a597; --accent:#ffdd00; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font:15px/1.75 system-ui,-apple-system,sans-serif; }
    body { padding:18px; }
    #preview { max-width:760px; margin:0 auto; }
    h1,h2,h3 { color:var(--accent); line-height:1.3; }
    a { color:#8dd9ff; }
    code { background:#2a2920; border:1px solid var(--border); border-radius:5px; padding:2px 5px; font-family:ui-monospace,monospace; }
    pre { overflow:auto; padding:13px; background:#10100c; border:1px solid var(--border); border-radius:9px; }
    pre code { padding:0; border:0; background:transparent; }
    blockquote { margin:1em 0; padding:8px 14px; border-left:3px solid var(--accent); background:#29260b; color:var(--muted); }
    table { width:100%; border-collapse:collapse; }
    th,td { padding:7px 9px; border:1px solid var(--border); text-align:left; }
    img,video { max-width:100%; border-radius:9px; }
    .callout { margin:1em 0; padding:11px 14px; border:1px solid #6c6120; border-left:4px solid var(--accent); border-radius:8px; background:#29260b; }
    .callout-title { color:var(--accent); font-weight:700; margin-bottom:3px; }
    .diagram { margin:1em 0; border:1px solid #31556a; border-radius:8px; overflow:hidden; }
    .diagram-label { padding:5px 10px; color:#8dd9ff; background:#14232b; font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
    .diagram pre { margin:0; border:0; border-radius:0; }
    .github-card { display:block; margin:1em 0; padding:12px 14px; border:1px solid #31556a; border-radius:8px; background:#14232b; color:var(--text); }
    .github-card strong { color:#8dd9ff; }
    .spoiler { margin:1em 0; padding:10px 13px; border:1px dashed var(--border); border-radius:8px; }
    .empty { color:var(--muted); text-align:center; padding:50px 12px; }
  </style>
</head>
<body>
  <main id="preview"><p class="empty">在编辑区输入 Markdown 后，这里会显示预览。</p></main>
  <script>
    window.pendingMarkdown = "";
    function escapeHtml(value) {
      return value.replace(/[&<>\"']/g, function (character) {
        return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[character];
      });
    }
    function escapeAttribute(value) { return escapeHtml(value).replace(/`/g, "&#96;"); }
    function prepare(source) {
      let value = source.replace(/::::([a-zA-Z]+)(?:\[([^\]]*)\])?\s*\n([\s\S]*?)\n::::/g, function (_, kind, customTitle, body) {
        const title = customTitle || ({note:"提示",tip:"技巧",warning:"注意",danger:"危险",important:"重要",caution:"注意"})[kind.toLowerCase()] || kind;
        return "<section class=\"callout\"><div class=\"callout-title\">" + escapeHtml(title) + "</div>" + marked.parse(body) + "</section>";
      });
      value = value.replace(/:::([a-zA-Z]+)\s*\n([\s\S]*?)\n:::/g, function (_, kind, body) {
        const title = ({note:"提示",tip:"技巧",warning:"注意",danger:"危险",important:"重要"})[kind.toLowerCase()] || kind;
        return "<section class=\"callout\"><div class=\"callout-title\">" + escapeHtml(title) + "</div>" + marked.parse(body) + "</section>";
      });
      value = value.replace(/:::github\{repo=["']([^"']+)["']\}/g, function (_, repo) {
        return "<div class=\"github-card\"><strong>GitHub</strong><br>" + escapeHtml(repo) + "</div>";
      });
      value = value.replace(/:spoiler\[([^\]]*)\]/g, function (_, hidden) {
        return "<details class=\"spoiler\"><summary>点击查看隐藏内容</summary>" + escapeHtml(hidden) + "</details>";
      });
      value = value.replace(/@\[(video|audio)\]\(([^)]+)\)/g, function (_, kind, url) {
        if (!/^https?:\/\//i.test(url)) return "`" + kind + ": " + url + "`";
        const tag = kind === "audio" ? "audio" : "video";
        return "<" + tag + " controls preload=\"metadata\" src=\"" + escapeAttribute(url) + "\"></" + tag + ">";
      });
      value = value.replace(/```(mermaid|plantuml)\n([\s\S]*?)```/g, function (_, kind, body) {
        return "<section class=\"diagram\"><div class=\"diagram-label\">" + kind + "</div><pre>" + escapeHtml(body.trim()) + "</pre></section>";
      });
      return value;
    }
    window.renderMarkdown = function (source) {
      const content = source && source.trim() ? marked.parse(prepare(source), {gfm:true, breaks:true}) : "<p class=\"empty\">在编辑区输入 Markdown 后，这里会显示预览。</p>";
      document.getElementById("preview").innerHTML = content;
    };
    if (window.pendingMarkdown) window.renderMarkdown(window.pendingMarkdown);
  </script>
</body>
</html>
