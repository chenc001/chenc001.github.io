name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION: ${{ github.ref_name }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          mkdir -p release-assets
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore
            export ANDROID_KEYSTORE_PATH="$GITHUB_WORKSPACE/android/release.keystore"
            (cd android && ./gradlew assembleRelease --no-daemon --stacktrace)
            cp android/app/build/outputs/apk/release/app-release.apk "release-assets/mizuki-blog-${GITHUB_REF_NAME}.apk"
          else
            echo "ANDROID_KEYSTORE_BASE64 is not configured; building a debug-signed fallback APK."
            (cd android && ./gradlew assembleDebug --no-daemon --stacktrace)
            cp android/app/build/outputs/apk/debug/app-debug.apk "release-assets/mizuki-blog-${GITHUB_REF_NAME}.apk"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/mizuki-blog-${{ github.ref_name }}.apk
